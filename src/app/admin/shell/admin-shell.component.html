<div class="wrapper" (click)="onWrapperClick()">

  <!-- ── TOP NAVIGATION BAR ── -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="brand-icon-wrapper">
        <img src="assets/mascot-icon.png" alt="AI Speaking Assistant">
      </div>
      <div class="brand-text">
        @if (adminMonitor.systemStatsIsLive) {
          <span class="pulse-status-badge live">
            <span class="pulse-dot"></span> System Live
          </span>
        } @else {
          <span class="pulse-status-badge mock">
            <span class="pulse-dot yellow"></span> Local Mode
          </span>
        }
      </div>
    </div>

    <!-- User Profile & Actions -->
    <div class="profile-area">
      <button class="avatar-btn" (click)="toggleProfileDropdown(); $event.stopPropagation()">
        <div class="avatar-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <svg class="chevron-svg" [class.open]="showProfileDropdown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      @if (showProfileDropdown) {
        <div class="profile-dropdown animate-fade" (click)="$event.stopPropagation()">
          <div class="dropdown-header">
            <div class="dd-avatar">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="dd-info">
              <p class="dd-name">ผู้ดูแลระบบ {{ session.currentUser?.username }}</p>
              <span class="dd-role">Super Administrator</span>
            </div>
          </div>
          <button class="dd-item" routerLink="profile" (click)="showProfileDropdown = false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            ข้อมูลโปรไฟล์
          </button>
          <div class="dd-divider"></div>
          <button class="dd-item dd-logout" (click)="logout()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ออกจากระบบ
          </button>
        </div>
      }
    </div>
  </header>

  <!-- ── MAIN CONTAINER ── -->
  <div class="body-flat">

    <!-- ── NAVIGATION SUB-TAB BAR ── -->
    <!-- Mobile-only toggle: same collapsible pattern as the Teacher shell,
         since this list has 5 items and permanently eats even more space
         on a phone. Desktop ignores navExpanded (see media query). -->
    <button type="button" class="nav-collapse-toggle" (click)="navExpanded = !navExpanded">
      <span>เมนู / Menu</span>
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        [class.rotated]="navExpanded"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <nav class="secondary-tabs" [class.mobile-collapsed]="!navExpanded" aria-label="Admin Sections">
      <button class="sub-tab-btn" routerLink="overview" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        ภาพรวมระบบ (Overview)
      </button>
      <button class="sub-tab-btn" routerLink="users" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        จัดการผู้ใช้งาน (Users)
        @if (adminUsers.pendingTeachersCount > 0) {
          <span class="tab-badge warning">{{ adminUsers.pendingTeachersCount }}</span>
        }
      </button>
      <button class="sub-tab-btn" routerLink="apis" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        จัดการ & เพิ่ม API (API Hub)
        <span class="tab-badge active">{{ adminApiHub.activeApiCount }}</span>
      </button>
      <button class="sub-tab-btn" routerLink="courses" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        คอร์ส & บทเรียน (Courses)
      </button>
      <button class="sub-tab-btn" routerLink="system" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        สุขภาพระบบ & Logs
      </button>
    </nav>

    <!-- ── ROUTED TAB CONTENT ── -->
    <div class="main-content-flat">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
