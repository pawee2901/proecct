<div class="wrapper">

  <!-- ── TOP NAVIGATION BAR ── -->
  <header class="top-nav">
    <div class="nav-brand">
      <div class="brand-icon-wrapper">
        <img src="assets/mascot-icon.png" alt="AI Speaking Assistant">
      </div>
      <div class="brand-text">
        <h2 class="app-name">AI Speaking Assistant</h2>
        <div class="sub-brand-row">
          <span class="app-subtitle">Teacher Portal / ส่วนจัดการอาจารย์</span>
          <span class="pulse-status-badge live">
            <span class="pulse-dot"></span> Online
          </span>
        </div>
      </div>
    </div>
    <div class="user-profile">
      <div class="profile-info">
        <span class="avatar-circle">T</span>
        <div class="user-details">
          <p class="user-name">อาจารย์ {{ session.currentUser?.firstName || 'ผู้สอน' }} {{ session.currentUser?.lastName || '' }}</p>
          <span class="user-role-badge">Teacher</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="ออกจากระบบ">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        ออกจากระบบ / Logout
      </button>
    </div>
  </header>

  <!-- ── MAIN CONTAINER ── -->
  <div class="body-flat">

    <!-- ── SECONDARY TAB BAR ── -->
    <!-- Mobile-only toggle: the tab list is collapsible below 768px so it
         doesn't permanently eat screen space on a phone. Desktop ignores
         navExpanded entirely (see media query) and always shows the row. -->
    <button type="button" class="nav-collapse-toggle" (click)="navExpanded = !navExpanded">
      <span>เมนู / Menu</span>
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        [class.rotated]="navExpanded"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <nav class="secondary-tabs" [class.mobile-collapsed]="!navExpanded" aria-label="Teacher Sections">
      <button class="sub-tab-btn" routerLink="students" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        รายงานสถิตินักศึกษา / Student Stats
      </button>
      <button class="sub-tab-btn" routerLink="lessons" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        จัดการบทเรียนและข้อสอบ / Manage Course
      </button>
      <button class="sub-tab-btn" routerLink="game-covers" routerLinkActive="active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
        เกม / Game
      </button>

      @if (showYearToggle) {
        <div class="year-toggle-group">
          <button type="button" class="sub-tab-btn year-tab-btn" [class.active]="session.activeYearLevel === 1" (click)="switchYearLevel(1)">
            ชั้นปีที่ 1 (Year 1)
          </button>
          <button type="button" class="sub-tab-btn year-tab-btn" [class.active]="session.activeYearLevel === 2" (click)="switchYearLevel(2)">
            ชั้นปีที่ 2 (Year 2)
          </button>
        </div>
      }
    </nav>

    <!-- ── ROUTED TAB CONTENT ── -->
    <div class="main-content-flat">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
